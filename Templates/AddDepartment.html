{% extends 'Layout.html' %}
 {% block project %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הוספת דירה</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fafafa;
            color: #333;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .submit-btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #45a049;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input[type="number"] {
            -moz-appearance: textfield;
        }

        /* להסתיר את תוויות הכותרת המיותרות */
        .hidden-label {
            display: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #4CAF50;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>הוספת דירה חדשה</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="city">עיר</label>
                {{ form.city }}
            </div>

            <div class="form-group">
                <label for="neighborhood">שכונה</label>
                {{ form.neighborhood }}
            </div>

            <div class="form-group">
                <label for="street">רחוב</label>
                {{ form.street }}
            </div>

            <div class="form-group">
                <label for="numRooms">מספר חדרים</label>
                {{ form.numRooms }}
            </div>

            <div class="form-group">
                <label for="price">מחיר</label>
                {{ form.price }}
            </div>

            <div class="form-group">
                <label for="isMediation">?האם יש תיווך</label>
                {{ form.isMediation }}
            </div>

            <div class="form-group">
                <label for="floor">קומה</label>
                {{ form.floor }}
            </div>


            <div class="form-group">
                 <label for="id_image">בחר תמונות:</label>
    <input type="file" name="image" id="id_image" multiple>
            </div>

            <button type="submit" class="submit-btn">הוסף</button>

        </form>
    </div>

</body>
</html>
{% endblock %}
